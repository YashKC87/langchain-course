<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEALIX v2.0 — Autonomous Infrastructure Healing</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <style>
      body { margin: 0; background: #060b14; }
      #loading {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; color: #00d2ff; font-family: 'Segoe UI', sans-serif;
        font-size: 18px; flex-direction: column; gap: 16px;
      }
      #loading .spinner {
        width: 40px; height: 40px; border: 3px solid rgba(0,210,255,0.2);
        border-top-color: #00d2ff; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
      <div id="loading">
        <div class="spinner"></div>
        <div>Loading HEALIX v2.0 Dashboard...</div>
      </div>
    </div>
    <script>
      // Fetch the JSX component, transform for browser, compile and render
      fetch('/static/healix-agent.jsx')
        .then(function(r) {
          if (!r.ok) throw new Error('Failed to load component: ' + r.status);
          return r.text();
        })
        .then(function(jsx) {
          // Replace ES module import with global React destructuring
          jsx = jsx.replace(
            /import\s*\{[^}]+\}\s*from\s*["']react["']\s*;?/,
            'const { useState, useEffect, useRef, useCallback } = React;'
          );
          // Remove "export default" so it's just a function declaration
          jsx = jsx.replace('export default function', 'function');

          // Compile JSX with Babel
          var compiled = Babel.transform(jsx, {
            presets: ['react'],
            filename: 'healix-agent.jsx'
          }).code;

          // Execute the compiled code
          var script = document.createElement('script');
          script.textContent = compiled;
          document.body.appendChild(script);

          // Render the component
          var root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(React.createElement(HealIXAgent));
        })
        .catch(function(err) {
          document.getElementById('root').innerHTML =
            '<div style="color:#ef4444;padding:40px;font-family:monospace;">' +
            '<h2>HEALIX Dashboard Load Error</h2>' +
            '<p>' + err.message + '</p>' +
            '<p>Make sure the server is running at http://localhost:8000</p></div>';
          console.error(err);
        });
    </script>
</body>
</html>
